# --- HTTP :80 — serve ACME challenges, redirect everything else to HTTPS ---
server {
    listen 80;
    listen [::]:80;

    server_name domain.tld;
    root /var/www/html;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 — the application ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name domain.tld;
    root /var/www/html;

    index index.html;

    client_max_body_size 150m;

    autoindex off;
    server_tokens off;

    # TLS — replace with your real certificate paths.
    ssl_certificate     /etc/letsencrypt/live/domain.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain.tld/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=15768000" always;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        rewrite ^ /init.php last;
    }

    location = /init.php {
        include snippets/fastcgi-php.conf;
        # Version-specific — point this at your PHP-FPM socket.
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/init.php;
        fastcgi_param SCRIPT_NAME /init.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }
}
