<!DOCTYPE html>
<html lang="en">
<head>
    <title>ezXSS Payload Tester</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        try { sessionStorage.clear(); } catch (e) {}
    </script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; }
        .title { background-color: rgb(43,49,87); color: rgb(94,100,139); padding: 5px; }
        a { margin-right: 10px; }
        .block { width: 20px; height: 20px; display: inline-block; }
        .circle { width: 20px; height: 20px; display: inline-block; border-radius: 10px; }
        table { border-collapse: collapse; } th, td { border: 1px solid #000; padding: 5px; }
        #status { margin-top: 16px; }
        #status h3 { margin: 0 0 4px; }
    </style>
</head>
<body>
    <h1 class="title">ezXSS Payload Tester</h1>

    <a href="#" onclick="window.location.reload(true); return false;">Reload page</a>
    <a href="#" onclick="window.location.href = location.pathname; return false;">Payload URL</a>
    <a href="/manage/payloads">Manage payloads</a>

    <p>This page fires the ezXSS payload for its own path.</p>
    <div id="browser"></div>
    <hr>
    <div id="swatches"></div>
    <div id="circles"></div>
    <div id="colors"></div>
    <div id="status"></div>

    <script>
        (function () {
            function esc(i){ return String(i).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

            try { document.getElementById("browser").innerHTML =
                "<p><b>Browser: </b>" + esc(navigator.appName) + " " + esc(navigator.appVersion) + "</p>"; } catch (t) {}

            try {
                var palette = ["red","green","blue","yellow","orange","black","white","purple","pink","gray"];
                var squares = "", circles = "";
                palette.forEach(function (c) {
                    squares += '<div class="block" style="background-color:' + c + '"></div>';
                    circles += '<div class="circle" style="background-color:' + c + '"></div>';
                });
                document.getElementById("swatches").innerHTML = squares;
                document.getElementById("circles").innerHTML = circles;
                var cd = document.getElementById("colors"), rnd = "";
                for (var i = 0; i < 10; i++) {
                    rnd += '<div class="block" style="background-color:#' +
                        Math.floor(Math.random() * 16777215).toString(16) + '"></div>';
                }
                cd.innerHTML = rnd;
            } catch (t) {}

            function renderStatus() {
                var s = document.getElementById("status");
                if (!s) { return; }
                s.innerHTML =
                    "<h3>Payload Status</h3>" +
                    "ezXSS payload initialized: <b>" + (typeof ez_nW === "function" ? "yes" : "no") + "</b><br>" +
                    "ezXSS screenshot initialized: <b>" + (typeof html2canvas === "function" ? "yes" : "no") + "</b><br>" +
                    "ezXSS persistent initialized: <b>" + (typeof ez_persist === "function" ? "yes" : "no") + "</b>";
            }
            renderStatus();

            try { sessionStorage.setItem("sessionStorageTester", Date.now()); } catch (t) {}
            try { localStorage.setItem("localStorageTester", Date.now()); } catch (t) {}
            try { document.cookie = "CookieTester=" + Date.now(); } catch (t) {}

            var payloadUrl = (location.protocol + "//" + location.host + location.pathname)
                .replace(/["'<>\\]/g, "");
            var s = document.createElement("script");
            s.src = payloadUrl;
            s.onload = renderStatus;
            s.onerror = renderStatus;
            document.body.appendChild(s);

            var ticks = 0;
            var iv = setInterval(function () {
                renderStatus();
                if (++ticks >= 20) { clearInterval(iv); }
            }, 200);
        })();
    </script>
</body>
</html>
